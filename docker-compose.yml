services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfoliopi-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "sqlite3 /app/data/portfoliopi.db \"SELECT 1 FROM job_heartbeats WHERE timestamp >= datetime('now', '-24 hours') LIMIT 1;\" | grep 1"]
      interval: 10m
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: portfoliopi-dashboard
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    volumes:
      - ./data:/app/data:ro
    ports:
      - "0.0.0.0:8653:8501"
    environment:
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
