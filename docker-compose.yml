services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfoliopi-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:

      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10m
      timeout: 20s
      retries: 3


