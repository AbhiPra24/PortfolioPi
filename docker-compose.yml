services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfoliopi-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    env_file:
      - .env
    environment:
      - YFINANCE_CACHE_DIR=/tmp
    ports:
      - "0.0.0.0:8654:8654"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./core:/app/core
      - ./bot:/app/bot
      - ./algo:/app/algo
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./app_config.py:/app/app_config.py
    healthcheck:
      test: ["CMD-SHELL", "sqlite3 /app/data/portfoliopi.db \"SELECT 1 FROM job_heartbeats WHERE job_name = 'run_breeze_sync' AND timestamp >= datetime('now', '-24 hours') LIMIT 1;\" | grep 1"]
      interval: 10m
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: portfoliopi-dashboard
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    volumes:
      - ./data:/app/data
      - ./dashboard:/app/dashboard
    ports:
      - "0.0.0.0:8653:8501"
    environment:
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD must be set in .env}
      - HOME=/app
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
