services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfoliopi-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPYCACHEPREFIX=/tmp/pycache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /app/logs:rw,noexec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10m
      timeout: 20s
      retries: 3


